<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PrizeMC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="images/websitelogo.ico">

  <meta property="og:title" content="PrizeMC.net">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/background.webp">
  <meta property="og:image:type" content="image/webp">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1131">
  <meta name="theme-color" content="#0d0a08">

  <link rel="stylesheet" href="styles.css">

</head>

<body>
  <main class="stage">
    <div class="content">
      <h1 class="wordmark">PrizeMC</h1>

      <section class="connect" aria-label="Server addresses">
        <button class="row" type="button" data-copy="prison.PrizeMC.net">
          <img class="block" src="images/block-grass.png" alt="" width="300" height="300">
          <span class="plat">Java</span>
          <span class="addr">
            <span class="ad">prison.PrizeMC.net</span>
          </span>
          <span class="hint" aria-hidden="true">copy</span>
        </button>

        <button class="row" type="button" data-copy="bedrock.PrizeMC.net">
          <img class="block" src="images/block-bedrock.png" alt="" width="300" height="300">
          <span class="plat">Bedrock</span>
          <span class="addr">
            <span class="ad">bedrock.PrizeMC.net</span>
          </span>
          <span class="hint" aria-hidden="true">copy</span>
        </button>
      </section>

      <nav class="links" aria-label="Community links">
        <a href="https://discord.gg/UDhe8mMga6">Discord</a>
        <a href="https://docs.google.com/document/d/1GlaIFboF0X7gD4o5vHMU-uc1eCAtAdjZgs3DtWGHv5E">Documentation</a>
      </nav>
    </div>

    <p class="disclaimer">We are not affiliated with Mojang Studios or Microsoft.</p>

    <p class="server-status" id="server-status" hidden>
      <span class="bubble" aria-hidden="true"></span>
      <span class="status-label"></span>
    </p>
  </main>

  <span class="visually-hidden" role="status" aria-live="polite" id="copy-status"></span>

  <script src="main.js" defer></script>
</body>

</html>
